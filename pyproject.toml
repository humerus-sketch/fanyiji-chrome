[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fanyiji-chrome"
version = "0.1.4"
description = "翻译姬：独立 Chrome 实时字幕与直播同步工具"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6-Essentials==6.12.0",
  "shiboken6==6.12.0",
  "numpy==2.5.3",
  "sherpa-onnx==1.13.8",
  "websocket-client==1.9.2",
  "pythonnet==3.2.1",
  "clr-loader==0.3.1",
  "cffi==2.1.1",
  "pycparser==3.11",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3"]

[project.scripts]
fanyiji-chrome = "fanyiji.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
